spring.application.name=Api-Gateway

server.port=3333

# Routes (auth/chat/products/api -> lb://ecommerce) are defined in GatewayConfig.java,
# alongside the rate-limiter filter. Do not redefine spring.cloud.gateway.routes[] here -
# duplicate route definitions race with the Java ones and would bypass the filter.

spring.main.web-application-type=reactive

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost


logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG



# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}?ssl-mode=REQUIRED
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Atharva123*}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Rate limiter (token bucket, state shared across gateway instances via Redis)
rate-limiter.redis.url=${REDIS_URL:redis://localhost:6379}
rate-limiter.capacity=${RATE_LIMIT_CAPACITY:20}
rate-limiter.refill-rate=${RATE_LIMIT_REFILL_RATE:10}